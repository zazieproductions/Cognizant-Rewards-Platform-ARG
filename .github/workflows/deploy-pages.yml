name: Deploy to GitHub Pages

# Publishes the static SPA to GitHub Pages. Because the app is a single-page
# React/Vite build with `base: '/Cognizant-Rewards-Platform-ARG/'`, the site
# serves at:
#   https://<owner>.github.io/Cognizant-Rewards-Platform-ARG/
#
# It deploys automatically on every push to `main` and can be re-triggered
# manually from the Actions tab (workflow_dispatch). A path-based redirect is
# not required — the app has no router, so every route is the root page.

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
